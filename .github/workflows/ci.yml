name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Format
        run: black --check .
      - name: Tests
        run: pytest -q
      - name: Security Audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
